# Stream sources.
#
# `iptv-org` is always loaded as the baseline dataset (channels, feeds, logos,
# guides, blocklist) — the entry below only sets its trust weight.
#
# To add your own list, append an entry with a unique `id` and a public M3U URL.
# `trust` (0-1) biases ranking when the same channel appears in several lists.
#
# Only add sources you have the right to redistribute. See docs/LEGAL.md.

sources:
  - id: iptv-org
    name: iptv-org community database
    type: iptv-org
    url: https://iptv-org.github.io/api
    enabled: true
    trust: 0.9
    license: The Unlicense
    homepage: https://github.com/iptv-org/iptv

  # Streams found by the nightly discovery run and auto-accepted: each one
  # matched a channel we already index and answered a live probe. Trust is low
  # so a curated list always outranks them, and health scoring retires them
  # like any other stream if they stop responding.
  - id: discovered
    name: Auto-discovered streams
    type: m3u
    url: https://raw.githubusercontent.com/romanschenk37/iptv/main/config/discovered.m3u
    enabled: true
    trust: 0.35

  - id: dach-extra
    name: DACH Extra
    type: m3u
    url: https://raw.githubusercontent.com/romanschenk37/iptv/main/config/dach-extra.m3u
    enabled: true
    trust: 0.8
    country: CH

  # --- Public broadcaster / free-to-air streams -----------------------------
