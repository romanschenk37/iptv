# EPG (XMLTV) sources consumed during a sync.
#
# These point at the guides this repository grabs for itself: the `EPG Grab`
# workflow runs the iptv-org/epg scraper for every site in `config/epg-grab.yml`
# and publishes the XMLTV to this repository's `state` branch.
#
# Each guide is downloaded, normalised to UTC, and matched to Nexus channel
# ids — first via upstream's authoritative `guides.json` mapping, then by exact
# id, then by fuzzy name matching narrowed to `countries` below. Filling in
# `countries` accurately is the single most effective way to avoid wrong links.
#
# Guides generated by our own EPG Grab are loaded from:
#
#   https://raw.githubusercontent.com/romanschenk37/iptv/state/epg/
#
# External finished XMLTV feeds remain external where appropriate.

sources:

  # ==========================================================================
  # DACH
  # ==========================================================================

  # --- Switzerland ----------------------------------------------------------

  - id: tv-blue-ch
    name: blue TV Switzerland
    url: https://raw.githubusercontent.com/romanschenk37/iptv/state/epg/tv-blue-ch.xml.gz
    enabled: true
    lang: de
    countries: [CH]
    trust: 0.95


  # --- Germany --------------------------------------------------------------

  - id: web-magentatv-de
    name: MagentaTV Germany
    url: https://raw.githubusercontent.com/romanschenk37/iptv/state/epg/web-magentatv-de.xml.gz
    enabled: true
    lang: de
    countries: [DE]
    trust: 0.95


  # --- Austria --------------------------------------------------------------

  - id: tvheute-at
    name: TV Heute Austria
    url: https://raw.githubusercontent.com/romanschenk37/iptv/state/epg/tvheute-at.xml.gz
    enabled: true
    lang: de
    countries: [AT]
    trust: 0.90


  # ==========================================================================
  # United States
  # ==========================================================================

  - id: tvtv-us
    name: tvtv.us (US / Canada listings)
    url: https://raw.githubusercontent.com/romanschenk37/iptv/state/epg/tvtv-us.xml.gz
    enabled: true
    lang: en
    countries: [US, CA]
    # 97% of this site's channels are already mapped upstream — highest trust
    # in the set, so it wins ties against any other guide.
    trust: 0.95


  # ==========================================================================
  # Free ad-supported streaming
  # ==========================================================================

  - id: pluto-tv
    name: Pluto TV
    url: https://raw.githubusercontent.com/romanschenk37/iptv/state/epg/pluto-tv.xml.gz
    enabled: true
    lang: en
    countries: [US, GB, DE, ES, FR, IT, BR, MX, CA, AU]
    trust: 0.85

  - id: plex-tv
    name: Plex live channels
    url: https://raw.githubusercontent.com/romanschenk37/iptv/state/epg/plex-tv.xml.gz
    enabled: true
    lang: en
    countries: [US, GB, CA, AU]
    trust: 0.8


  # These three are published as finished XMLTV and refreshed daily at source,
  # so they are downloaded directly rather than grabbed. They cover exactly the
  # FAST services that many streams come from.

  - id: samsung-tvplus
    name: Samsung TV Plus (official guide)
    url: https://i.mjh.nz/SamsungTVPlus/all.xml.gz
    enabled: true
    lang: en
    countries: [US, GB, DE, FR, IT, ES, CA, KR, IN, AT, CH]
    trust: 0.85

  - id: plutotv-guide
